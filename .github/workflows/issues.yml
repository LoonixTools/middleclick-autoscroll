name: issues

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  # The "fixed" and "not chromium" labels answer and close the issue.
  close:
    name: close on label
    if: >-
      github.event.issue.state == 'open'
      && (github.event.label.name == 'fixed' || github.event.label.name == 'not chromium')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ github.event.label.name }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$LABEL" = fixed ]; then
            reason=completed
            comment='Fixed, thanks for the report! The fix comes with the next release.'
          else
            reason='not planned'
            comment='Thanks for the report! This app is not built on Chromium, Electron or CEF. So it has no autoscroll built in that this tool could turn on.'
          fi
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason "$reason" --comment "$comment"
